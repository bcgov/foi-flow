name: CD - Automatic Deploy

on:
  # Runs after PR merge into dev/main.
  # dev  -> deploy to dev environment
  # main -> deploy to test environment with release label
  pull_request:
    types:
      - closed
    branches:
      - dev
      - main


env:
  # CI tags images using the PR number.
  # The same tag is deployed after merge.
  IMAGE_TAG: ${{ github.event.pull_request.number }}


jobs:

  # Determines:
  # - target environment
  # - services affected by this PR
  # - release label (main only)
  prepare-deployment:
      if: github.event.pull_request.merged == true
      permissions:
        contents: read
        pull-requests: read
      runs-on: ubuntu-latest
      outputs:
        environment: ${{ steps.generate.outputs.environment }}
        matrix: ${{ steps.generate.outputs.matrix }}
        release_label: ${{ steps.generate.outputs.release_label }}
        run_migrations: ${{ steps.generate.outputs.run_migrations }}
  
      steps:
        - name: Checkout
          uses: actions/checkout@v6
  
        - name: Install yq
          run: |
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
  
        - name: Generate Deployment Configuration
          id: generate
          shell: bash
          env:
            PR_BODY: ${{ github.event.pull_request.body }}
            GH_TOKEN: ${{ github.token }}
  
          run: |
            if [[ "${{ github.event.pull_request.base.ref }}" == "dev" ]]; then
              TARGET_ENVIRONMENT="dev"
            else
              TARGET_ENVIRONMENT="test"
            fi
  
            RELEASE_LABEL=""
            if [[ "$TARGET_ENVIRONMENT" == "test" ]]; then
              RELEASE_LABEL=$(grep '^Release Label:' <<< "$PR_BODY" \
                | cut -d':' -f2- \
                | xargs)
  
              if [[ -z "$RELEASE_LABEL" ]]; then
                echo "::error::Release label is required for main deployments."
                exit 1
              fi
            fi
  
            echo "release_label=${RELEASE_LABEL}" >> "$GITHUB_OUTPUT"
  
            CHANGED_FILES=$(gh api \
              repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
              --paginate \
              --jq '.[].filename')
  
            MATRIX='{"include":['
            FIRST=true
            RUN_MIGRATIONS=false
  
            COUNT=$(yq '.services | length' .github/configuration/service-catalog.yaml)
  
            for ((i=0;i<COUNT;i++))
            do
              NAME=$(yq ".services[$i].name" .github/configuration/service-catalog.yaml)
              PATH_VALUE=$(yq ".services[$i].path" .github/configuration/service-catalog.yaml)
              IMAGE=$(yq ".services[$i].image" .github/configuration/service-catalog.yaml)
              KIND=$(yq ".services[$i].kind // \"deployment\"" .github/configuration/service-catalog.yaml)
              LARGEFILES=$(yq ".services[$i].largefiles // false" .github/configuration/service-catalog.yaml)
  
              if echo "$CHANGED_FILES" | grep -q "^${PATH_VALUE}/"; then
                if [[ "$NAME" == "request-management-api" ]]; then
                  RUN_MIGRATIONS=true
                fi
  
                if [[ "$FIRST" == false ]]; then
                  MATRIX="${MATRIX},"
                fi
  
                MATRIX="${MATRIX}{\"name\":\"${NAME}\",\"path\":\"${PATH_VALUE}\",\"image\":\"${IMAGE}\",\"kind\":\"${KIND}\"}"
                FIRST=false
  
                if [[ "$LARGEFILES" == "true" ]]; then
                  MATRIX="${MATRIX},"
                  MATRIX="${MATRIX}{\"name\":\"${NAME}-largefiles\",\"path\":\"${PATH_VALUE}\",\"image\":\"${IMAGE}\",\"kind\":\"${KIND}\"}"
                fi
              fi
            done
  
            MATRIX="${MATRIX}]}"
  
            echo "environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
            echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
            echo "run_migrations=${RUN_MIGRATIONS}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Runs database migrations IFF request-management-api is being deployed.
  # ---------------------------------------------------------------------------
  run-api-migrations:
    name: Run API Migrations
    needs: prepare-deployment
    if: needs.prepare-deployment.outputs.run_migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        shell: bash
        env:
          MANIFEST_REPO_DEPLOY_KEY: ${{ secrets.MANIFEST_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${MANIFEST_REPO_DEPLOY_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

      - name: Update CronJob in GitOps Manifests
        shell: bash
        run: |
          git clone git@github.com:bcgov-c/tenant-gitops-d7abee.git
          cd tenant-gitops-d7abee

          VALUES_FILE="foi-flow/values-${{ needs.prepare-deployment.outputs.environment }}.yaml"
          CRONJOB_NAME="request-management-api-migrations"

          echo "Updating CronJob ${CRONJOB_NAME} with tag ${{ env.IMAGE_TAG }}"

          # Update the CronJob container image tag in the GitOps values file
          yq e \
            ".cronJobs.${CRONJOB_NAME}.image.tag = \"${{ env.IMAGE_TAG }}\"" \
            -i "$VALUES_FILE"

          git config user.email "adam.kroon@gov.bc.ca"
          git config user.name "adamkroonbcgov"

          git add "$VALUES_FILE"
          git commit -m "Update ${CRONJOB_NAME} to tag ${{ env.IMAGE_TAG }} [skip ci]" || exit 0

          RETRY_DELAYS=(15 30 60 120 240)
          for attempt in $(seq 1 5); do
            if git push origin main; then
              break
            fi
            sleep "${RETRY_DELAYS[$((attempt-1))]}"
            git pull --rebase origin main || exit 1
          done

      - name: Install OC CLI
        uses: redhat-actions/oc-installer@35b60c3f9757ae4301521556e1b75ff6f59f8d7c
        with:
          oc_version: '4.6'

      - name: Login to OpenShift
        run: |
          oc login \
            --server="${{ secrets.OPENSHIFT4_LOGIN_REGISTRY }}" \
            --token="${{ secrets.OPENSHIFT4_SA_TOKEN }}"

      - name: Trigger Migration Job and Wait
        shell: bash
        run: |
          NAMESPACE="d7abee-${{ needs.prepare-deployment.outputs.environment }}"
          CRONJOB="request-management-api-migrations"
          JOB_NAME="migration-pr-${{ env.IMAGE_TAG }}-$(date +%s)"
          EXPECTED_TAG="${{ env.IMAGE_TAG }}"

          oc project "${NAMESPACE}"

          echo "Waiting for ArgoCD to sync the CronJob image tag in OpenShift..."
          for i in {1..30}; do
            CURRENT_TAG=$(oc get cronjob "${CRONJOB}" \
              -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}' 2>/dev/null \
              | awk -F':' '{print $NF}')

            if [[ "${CURRENT_TAG}" == "${EXPECTED_TAG}" ]]; then
              echo "CronJob manifest updated to tag ${EXPECTED_TAG}."
              break
            fi

            if [[ "$i" -eq 30 ]]; then
              echo "::error::Timed out waiting for CronJob ${CRONJOB} to reflect image tag ${EXPECTED_TAG}."
              exit 1
            fi
            sleep 10
          done

          echo "Spawning ad-hoc Job ${JOB_NAME} from CronJob ${CRONJOB}..."
          oc create job --from="cronjob/${CRONJOB}" "${JOB_NAME}"

          echo "Waiting for job/${JOB_NAME} to complete..."
          # Wait up to 10 minutes (600s) for job completion
          if ! oc wait --for=condition=complete "job/${JOB_NAME}" --timeout=600s; then
            echo "::error::Migration job ${JOB_NAME} failed or timed out!"
            echo "--- Pod Logs ---"
            oc logs "job/${JOB_NAME}" --all-containers=true || true
            echo "--- Job Description ---"
            oc describe "job/${JOB_NAME}"
            exit 1
          fi

          echo "✅ Migration job/${JOB_NAME} completed successfully."



  # Updates the GitOps repository with the new image tag and release label.
  # ArgoCD will detect this change and deploy the application.
  deploy:

    name: Update GitOps Repository

    permissions:
      contents: read
      
    needs: prepare-deployment

    runs-on: ubuntu-latest

    if: ${{ fromJson(needs.prepare-deployment.outputs.matrix).include[0] != null }}


    steps:

      # Add deploy key to runner
      - name: Setup SSH
        shell: bash
        env:
          MANIFEST_REPO_DEPLOY_KEY: ${{ secrets.MANIFEST_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${MANIFEST_REPO_DEPLOY_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

      - name: Update GitOps manifests

        shell: bash

        run: |

          # Clone GitOps repository containing Helm values.
          git clone git@github.com:bcgov-c/tenant-gitops-d7abee.git


          cd tenant-gitops-d7abee


          VALUES_FILE="foi-flow/values-${{ needs.prepare-deployment.outputs.environment }}.yaml"


          # Update only services affected by the PR.
          echo '${{ needs.prepare-deployment.outputs.matrix }}' \
          | jq -c '.include[]' \
          | while read SERVICE
          do

            NAME=$(echo "$SERVICE" | jq -r '.name')


            echo "Updating ${NAME}"
            
            KIND=$(echo "$SERVICE" | jq -r '.kind // "deployment"')
            
            if [[ "${KIND}" == "cronjob" ]]; then
              GITOPS_SECTION="cronJobs"
            else 
              GITOPS_SECTION="deployments"
            fi

            # Update image tag.
            yq e \
              ".${GITOPS_SECTION}.${NAME}.image.tag = \"${{ env.IMAGE_TAG }}\"" \
              -i "$VALUES_FILE"

            # Update Pull Request Label
            if [[ "${{ github.event.pull_request.base.ref }}" == "dev" ]]; then
              yq e \
                ".${GITOPS_SECTION}.${NAME}.labels.pull-request-number = \"${{ env.IMAGE_TAG }}\"" \
                -i "$VALUES_FILE"
            fi


            # Add release label only for test deployments.
            if [[ "${{ needs.prepare-deployment.outputs.environment }}" == "test" ]]; then

              yq e \
                ".${GITOPS_SECTION}.${NAME}.labels.release-label = \"${{ needs.prepare-deployment.outputs.release_label }}\"" \
                -i "$VALUES_FILE"

            fi

          done

          git config user.email "manish.sihag@gov.bc.ca"
          git config user.name "ManishSihag"

          git add "$VALUES_FILE"

          git commit \
            -m "Deploy image tag ${{ env.IMAGE_TAG }} to ${{ needs.prepare-deployment.outputs.environment }}" \
            || exit 0


          # Retry push because multiple services may update GitOps simultaneously.
          RETRY_DELAYS=(15 30 60 120 240)

          for attempt in $(seq 1 5)
          do
            if git push origin main; then
              exit 0
            fi

            sleep "${RETRY_DELAYS[$((attempt-1))]}"

            git pull --rebase origin main || exit 1
          done

          exit 1


  # Confirms OpenShift is running the expected image
  # and waits until the deployment rollout completes.
  validate-deployment:

    name: Validate Deployment

    needs:
      - prepare-deployment
      - deploy

    permissions: {}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-deployment.outputs.matrix) }}


    runs-on: ubuntu-latest


    steps:
      # Install OC CLI
      - name: Install OC CLI
        uses: redhat-actions/oc-installer@35b60c3f9757ae4301521556e1b75ff6f59f8d7c
        with:
          oc_version: '4.6'

      # Login and verify every service from the deployment matrix.
      - name: Login to OpenShift
        run: |
          oc login \
            --server="${{ secrets.OPENSHIFT4_LOGIN_REGISTRY }}" \
            --token="${{ secrets.OPENSHIFT4_SA_TOKEN }}"


      - name: Verify Deployment
        shell: bash
        run: |
          NAMESPACE="d7abee-${{ needs.prepare-deployment.outputs.environment }}"
          DEPLOYMENT="deployment/${{ matrix.name }}"
          EXPECTED_TAG="${{ env.IMAGE_TAG }}"
      
          oc project "${NAMESPACE}"
      
          echo "========================================"
          echo "Verifying ${DEPLOYMENT}"
          echo "Namespace: ${NAMESPACE}"
          echo "Expected image tag: ${EXPECTED_TAG}"
          echo "========================================"
      
          echo "Waiting for ${DEPLOYMENT} to use image tag ${EXPECTED_TAG}..."
      
          for i in {1..60}; do
            DEPLOYED_IMAGE=$(oc get "${DEPLOYMENT}" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
      
            echo "Attempt ${i}/60 - Current image: ${DEPLOYED_IMAGE}"
      
            if [[ "${DEPLOYED_IMAGE}" == *":${EXPECTED_TAG}" ]]; then
              echo "Expected image tag detected."
              break
            fi
      
            if [[ "$i" -eq 60 ]]; then
              echo "::error::${DEPLOYMENT} did not update to image tag ${EXPECTED_TAG} within 10 minutes."
              echo "::error::Current image: ${DEPLOYED_IMAGE}"
              exit 1
            fi
      
            sleep 10
          done
      
          echo "========================================"
          echo "Image verification successful"
          echo "Running image: ${DEPLOYED_IMAGE}"
          echo "Expected tag: ${EXPECTED_TAG}"
          echo "========================================"
      # Adds deployment result back to the PR.
  comment-pr:

    name: Comment on Pull Request

    permissions:
      contents: read
      pull-requests: write

    needs:
      - prepare-deployment
      - validate-deployment

    if: success()

    runs-on: ubuntu-latest

    steps:

      - name: Generate Deployment Summary
        id: summary
        shell: bash
        run: |

          SERVICES=$(echo '${{ needs.prepare-deployment.outputs.matrix }}' | jq -r '
            .include[]
            | "- ✅ \(.name)"
          ')

          {
            echo "comment<<EOF"
            echo "## 🚀 Deployment Completed"
            echo
            echo "**Environment**"
            echo "\`${{ needs.prepare-deployment.outputs.environment }}\`"
            echo
            echo "**Image Tag**"
            echo "\`${{ env.IMAGE_TAG }}\`"
            echo

            if [[ "${{ needs.prepare-deployment.outputs.environment }}" == "test" ]]; then
              echo "**Release Label**"
              echo "\`${{ needs.prepare-deployment.outputs.release_label }}\`"
              echo
            fi

            echo "### Services Deployed"
            echo
            echo "$SERVICES"
            echo
            echo "✅ GitOps manifests updated successfully."
            echo "✅ ArgoCD synchronized the application."
            echo "✅ All deployments completed successfully."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on Pull Request
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
        with:
          message: ${{ steps.summary.outputs.comment }}
